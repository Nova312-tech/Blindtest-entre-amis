name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        shell: pwsh
        run: |
          winget install --id Gyan.FFmpeg -e --accept-package-agreements --accept-source-agreements
          winget install --id Cloudflare.cloudflared -e --accept-package-agreements --accept-source-agreements
          winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements
      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        shell: pwsh
        run: .\build-windows.ps1
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "build/windows/installer/Blind-test-v2-FR-Setup.exe"
          (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() + "  Blind-test-v2-FR-Setup.exe" |
            Set-Content "build/windows/installer/Blind-test-v2-FR-Setup.exe.sha256"
      - name: Publish installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/windows/installer/Blind-test-v2-FR-Setup.exe
            build/windows/installer/Blind-test-v2-FR-Setup.exe.sha256
