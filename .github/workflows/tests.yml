name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile sources
        run: python -m py_compile blindtest.py jeu.py donnees_quiz.py
      - name: Run tests
        run: python -m unittest discover -s tests
